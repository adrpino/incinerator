[package]
name = "incinerator"
version = "0.1.11"
edition = "2024"
authors = ["incinerator@protocol4.trade"]
description = "A CLI tool to track how much money you're burning through tokens across Cline, Claude Code, and Gemini CLI"
license = "MIT"
repository = "https://github.com/adrpino/incinerator"
keywords = ["ai", "costs", "tokens", "cline", "claude", "gemini"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
dirs = "5.0"
rayon = "1.12"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.28"
notify = "6.1"
rusqlite = { version = "0.33", features = ["bundled"] }
zstd = "0.13"
phf = { version = "0.13.1", features = ["macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel code generation to enable more optimizations
panic = "abort"     # Remove unwinding code
strip = true        # Automatically strip symbols from the binary

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist-version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Allow manual modifications to the CI workflow file
allow-dirty = ["ci"]
# The installers to generate for each release
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

