[package]
name = "incinerator"
version = "0.1.0"
edition = "2024"
authors = ["incinerator@protocol4.trade"]
description = "A CLI tool to track how much money you're burning through tokens across Cline, Claude Code, and Gemini CLI"
license = "MIT"
repository = "https://github.com/adrpino/incinerator"
keywords = ["ai", "costs", "tokens", "cline", "claude", "gemini"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
dirs = "5.0"
rayon = "1.12"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.28"
notify = "6.1"
rusqlite = { version = "0.33", features = ["bundled"] }
zstd = "0.13"
phf = { version = "0.13.1", features = ["macros"] }
aho-corasick = "1.1.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel code generation to enable more optimizations
panic = "abort"     # Remove unwinding code
strip = true        # Automatically strip symbols from the binary
